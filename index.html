<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GITHA MART - Aplikasi Kasir</title>

<style>
:root {
    --hijau: #239B69;
    --hijau-gelap: #285C50;
    --ungu: #7048BE;
    --merah: #DC414B;
    --oranye: #F0912D;
    --latar: #F2F5FC;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--latar);
    color: #303747;
}

button, input, select {
    font: inherit;
}

button {
    border: none;
    padding: 12px 16px;
    border-radius: 7px;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: .9;
}

input, select {
    width: 100%;
    padding: 11px;
    border: 1px solid #bbb;
    border-radius: 7px;
    margin-top: 7px;
}

.btn-hijau { background: var(--hijau); }
.btn-merah { background: var(--merah); }
.btn-ungu { background: var(--ungu); }
.btn-oranye { background: var(--oranye); }
.btn-abu { background: #555B68; }

/* LOGIN */

.login-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: linear-gradient(135deg, #e5eee9, #f8f5ec);
}

.login-box {
    background: white;
    width: 100%;
    max-width: 420px;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 8px 25px #0002;
}

.login-title {
    background: var(--hijau-gelap);
    color: white;
    text-align: center;
    padding: 18px;
    font-size: 27px;
    font-weight: bold;
    border-radius: 10px;
}

.welcome {
    text-align: center;
    color: var(--hijau-gelap);
    font-size: 19px;
    font-weight: bold;
    margin: 20px 0;
}

.login-box label {
    display: block;
    font-weight: bold;
    margin-top: 15px;
}

.login-box button {
    width: 100%;
    margin-top: 22px;
    background: var(--hijau-gelap);
}

/* APLIKASI KASIR */

#halamanKasir {
    display: none;
}

header {
    background: #777;
    color: white;
    text-align: center;
    padding: 23px 10px;
}

header h1 {
    margin: 0;
    font-size: 25px;
}

.container {
    max-width: 1250px;
    margin: auto;
    padding: 18px;
}

.panel {
    background: white;
    padding: 17px;
    border-radius: 12px;
    margin-bottom: 16px;
    box-shadow: 0 3px 12px #0001;
}

.panel h3 {
    color: var(--ungu);
    margin-top: 0;
}

.input-area {
    display: grid;
    grid-template-columns: 2fr 1fr auto;
    gap: 12px;
    align-items: end;
}

label {
    font-weight: bold;
    font-size: 14px;
}

.layout {
    display: grid;
    grid-template-columns: 1fr 330px;
    gap: 16px;
}

.table-wrapper {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;
    min-width: 550px;
    border-collapse: collapse;
}

th {
    background: var(--ungu);
    color: white;
    padding: 13px 9px;
}

td {
    padding: 12px 9px;
    text-align: center;
    border-bottom: 1px solid #ddd;
}

tbody tr:nth-child(even) {
    background: #EEF3FF;
}

tbody tr.selected {
    outline: 2px solid var(--ungu);
}

.total {
    font-size: 24px;
    color: var(--ungu);
    font-weight: bold;
    margin: 12px 0 20px;
}

.kembalian {
    font-size: 21px;
    color: var(--hijau);
    font-weight: bold;
    margin: 12px 0;
}

.payment button {
    width: 100%;
    margin-top: 15px;
}

.action-buttons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 18px;
}

.action-buttons button {
    min-width: 130px;
}

.footer {
    text-align: center;
    padding: 15px;
    color: #777;
}

/* STRUK */

.receipt-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #0009;
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.receipt-box {
    background: white;
    width: 100%;
    max-width: 480px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 20px;
    border-radius: 12px;
}

.receipt-title {
    text-align: center;
    color: var(--ungu);
}

.receipt-text {
    background: #FFFDF0;
    border: 1px dashed #999;
    padding: 18px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-family: monospace;
    font-size: 14px;
    line-height: 1.6;
}

.receipt-buttons {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.receipt-buttons button {
    flex: 1;
}

@media(max-width: 850px) {
    .layout {
        grid-template-columns: 1fr;
    }
}

@media(max-width: 560px) {
    .container {
        padding: 10px;
    }

    .input-area {
        grid-template-columns: 1fr 90px;
    }

    .input-area button {
        grid-column: 1 / -1;
        width: 100%;
    }

    .action-buttons button {
        flex: 1 1 40%;
    }

    header h1 {
        font-size: 20px;
    }
}

@media print {
    body * {
        visibility: hidden;
    }

    #areaStruk, #areaStruk * {
        visibility: visible;
    }

    #areaStruk {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        border: none;
    }

    .receipt-buttons, .receipt-title {
        display: none;
    }
}
</style>
</head>

<body>

<!-- HALAMAN LOGIN -->

<section class="login-page" id="halamanLogin">

    <div class="login-box">

        <div class="login-title">
            GITHA MART
        </div>

        <div class="welcome">
            SELAMAT DATANG
        </div>

        <form id="formLogin">

            <label>Username</label>
            <input type="text" id="username"
                   placeholder="Masukkan username" required>

            <label>Password</label>
            <input type="password" id="password"
                   placeholder="Masukkan password" required>

            <button type="submit">
                LOGIN
            </button>

        </form>

        <p style="text-align:center;color:#777;">
            Selamat berbelanja di toko kami 💚
        </p>

    </div>

</section>

<!-- HALAMAN KASIR -->

<section id="halamanKasir">

<header>
    <h1>GITHA MART - APLIKASI KASIR</h1>
    <p>Selamat Berbelanja di Toko Kami 💚</p>
</header>

<main class="container">

    <div class="layout">

        <div>

            <!-- INPUT BARANG -->

            <section class="panel">

                <h3>INPUT BARANG</h3>

                <div class="input-area">

                    <div>
                        <label>Nama Barang</label>
                        <select id="pilihanBarang"></select>
                    </div>

                    <div>
                        <label>Jumlah</label>
                        <input type="number" id="jumlahBarang"
                               min="1" max="1000" value="1">
                    </div>

                    <button class="btn-hijau" id="btnTambah">
                        Tambah Barang
                    </button>

                </div>

            </section>

            <!-- TABEL TRANSAKSI -->

            <section class="panel">

                <h3>DAFTAR TRANSAKSI</h3>

                <div class="table-wrapper">

                    <table>

                        <thead>
                            <tr>
                                <th>Nama Barang</th>
                                <th>Harga</th>
                                <th>Jumlah</th>
                                <th>Subtotal</th>
                            </tr>
                        </thead>

                        <tbody id="isiTabel">
                        </tbody>

                    </table>

                </div>

            </section>

        </div>

        <!-- PEMBAYARAN -->

        <section class="panel payment">

            <h3>PEMBAYARAN</h3>

            <label>Total Belanja:</label>

            <div class="total" id="lblTotal">
                Rp0
            </div>

            <label>Uang Pembayaran (Rp):</label>

            <input type="number" id="txtBayar"
                   min="0" placeholder="Masukkan pembayaran">

            <label style="display:block;margin-top:20px;">
                Kembalian:
            </label>

            <div class="kembalian" id="lblKembalian">
                Rp0
            </div>

            <button class="btn-hijau" id="btnBayar">
                PROSES PEMBAYARAN
            </button>

        </section>

    </div>

    <!-- TOMBOL BAWAH -->

    <div class="action-buttons">

        <button class="btn-merah" id="btnHapus">
            Hapus Barang
        </button>

        <button class="btn-oranye" id="btnReset">
            Reset Transaksi
        </button>

        <button class="btn-abu" id="btnKeluar">
            Keluar
        </button>

    </div>

</main>

<footer class="footer">
    © 2026 GITHA MART | Aplikasi Kasir
</footer>

</section>

<!-- JENDELA STRUK TERPISAH -->

<div class="receipt-overlay" id="jendelaStruk">

    <div class="receipt-box">

        <h2 class="receipt-title">
            GITHA MART - STRUK BELANJA
        </h2>

        <div class="receipt-text" id="areaStruk"></div>

        <div class="receipt-buttons">

            <button class="btn-ungu" id="btnCetak">
                Cetak Struk
            </button>

            <button class="btn-merah" id="btnTutup">
                Tutup
            </button>

        </div>

    </div>

</div>

<script>

// DATA BARANG

const barang = [
    {nama:"Air Mineral Botol", harga:4000},
    {nama:"Teh Kotak melati", harga:5000},
    {nama:"Teh Botol Sosro", harga:7000},
    {nama:"Kacang Atom", harga:8000},
    {nama:"Wafer Kaleng Keju", harga:25000},
    {nama:"Milku", harga:5000},
    {nama:"Kopi Susu Botol", harga:10000},
    {nama:"Biskuit Coklat Sandwich", harga:7500}
];

// FORMAT RUPIAH

function rupiah(nilai) {
    return new Intl.NumberFormat("id-ID", {
        style: "currency",
        currency: "IDR",
        maximumFractionDigits: 0
    }).format(nilai);
}

// VARIABEL

let daftarBarang = [];
let total = 0;
let uangBayar = 0;
let pembayaranSelesai = false;
let barisTerpilih = -1;

// ELEMENT

const pilihanBarang = document.getElementById("pilihanBarang");
const isiTabel = document.getElementById("isiTabel");

// MEMASUKKAN BARANG KE PILIHAN

barang.forEach((item, index) => {

    const option = document.createElement("option");

    option.value = index;
    option.textContent =
        item.nama + " - " + rupiah(item.harga);

    pilihanBarang.appendChild(option);

});

// LOGIN

document.getElementById("formLogin")
.addEventListener("submit", function(e) {

    e.preventDefault();

    const user =
        document.getElementById("username").value.trim();

    const pass =
        document.getElementById("password").value;

    if(user === "26March" && pass === "Laia") {

        document.getElementById("halamanLogin").style.display = "none";

        document.getElementById("halamanKasir").style.display = "block";

    } else {

        alert("Username atau password salah!");

        document.getElementById("password").value = "";

    }

});

// TAMPILKAN TABEL

function tampilkanTabel() {

    isiTabel.innerHTML = "";

    if(daftarBarang.length === 0) {

        isiTabel.innerHTML =
            '<tr><td colspan="4">Belum ada barang.</td></tr>';

    }

    daftarBarang.forEach((item, index) => {

        const baris = document.createElement("tr");

        if(index === barisTerpilih) {
            baris.classList.add("selected");
        }

        baris.innerHTML = `
            <td>${item.nama}</td>
            <td>${rupiah(item.harga)}</td>
            <td>${item.jumlah}</td>
            <td>${rupiah(item.harga * item.jumlah)}</td>
        `;

        baris.addEventListener("click", function() {

            barisTerpilih = index;
            tampilkanTabel();

        });

        isiTabel.appendChild(baris);

    });

    hitungTotal();

}

// TAMBAH BARANG

document.getElementById("btnTambah")
.addEventListener("click", function() {

    if(pembayaranSelesai) {
        alert("Silakan reset transaksi dahulu.");
        return;
    }

    const index = Number(pilihanBarang.value);

    const jumlah = Number(
        document.getElementById("jumlahBarang").value
    );

    if(!Number.isInteger(jumlah) || jumlah < 1 || jumlah > 1000) {
        alert("Jumlah barang tidak valid!");
        return;
    }

    const item = barang[index];

    const sudahAda = daftarBarang.find(
        b => b.nama === item.nama
    );

    if(sudahAda) {

        sudahAda.jumlah += jumlah;

    } else {

        daftarBarang.push({
            nama: item.nama,
            harga: item.harga,
            jumlah: jumlah
        });

    }

    document.getElementById("jumlahBarang").value = 1;
    document.getElementById("txtBayar").value = "";
    document.getElementById("lblKembalian").textContent = rupiah(0);

    barisTerpilih = -1;

    tampilkanTabel();

});

// HITUNG TOTAL

function hitungTotal() {

    total = 0;

    daftarBarang.forEach(item => {

        total += item.harga * item.jumlah;

    });

    document.getElementById("lblTotal").textContent =
        rupiah(total);

}

// HAPUS BARANG

document.getElementById("btnHapus")
.addEventListener("click", function() {

    if(pembayaranSelesai) {
        alert("Silakan reset transaksi dahulu.");
        return;
    }

    if(barisTerpilih === -1) {

        alert("Pilih barang pada tabel terlebih dahulu.");

        return;

    }

    daftarBarang.splice(barisTerpilih, 1);

    barisTerpilih = -1;

    tampilkanTabel();

});

// RESET TRANSAKSI

document.getElementById("btnReset")
.addEventListener("click", function() {

    if(confirm("Hapus semua barang dan reset transaksi?")) {

        daftarBarang = [];
        total = 0;
        uangBayar = 0;
        pembayaranSelesai = false;
        barisTerpilih = -1;

        document.getElementById("txtBayar").value = "";

        document.getElementById("jumlahBarang").value = 1;

        document.getElementById("lblKembalian").textContent =
            rupiah(0);

        tampilkanTabel();

    }

});

// PROSES PEMBAYARAN

document.getElementById("btnBayar")
.addEventListener("click", function() {

    if(pembayaranSelesai) {
        alert("Pembayaran sudah selesai. Reset untuk transaksi baru.");
        return;
    }

    if(daftarBarang.length === 0) {

        alert("Tambahkan barang terlebih dahulu.");

        return;

    }

    const input = document.getElementById("txtBayar").value.trim();

    if(input === "" || !/^\d+$/.test(input)) {

        alert("Masukkan nominal pembayaran yang benar.");

        return;

    }

    uangBayar = Number(input);

    if(!Number.isSafeInteger(uangBayar)) {
        alert("Nominal pembayaran terlalu besar atau tidak valid.");
        return;
    }

    if(uangBayar < total) {

        alert("Uang pembayaran kurang!");

        return;

    }

    const kembalian = uangBayar - total;

    document.getElementById("lblKembalian").textContent =
        rupiah(kembalian);

    buatStruk(kembalian);

    pembayaranSelesai = true;

    document.getElementById("jendelaStruk").style.display =
        "flex";

});

// MEMBUAT STRUK

function buatStruk(kembalian) {

    let struk = "";

    struk += "        GITHA MART\n";
    struk += "     STRUK PEMBELIAN\n";
    struk += "--------------------------------\n";

    daftarBarang.forEach(item => {

        struk += item.nama + "\n";

        struk += "  " + item.jumlah +
                 " x " + rupiah(item.harga) + "\n";

        struk += "  Subtotal: " +
                 rupiah(item.harga * item.jumlah) + "\n";

    });

    struk += "--------------------------------\n";

    struk += "Total     : " + rupiah(total) + "\n";

    struk += "Bayar     : " + rupiah(uangBayar) + "\n";

    struk += "Kembalian : " + rupiah(kembalian) + "\n";

    struk += "--------------------------------\n";

    struk += "       Terima kasih! ♥\n";
    struk += "  Jangan Lupa Kembali Lagi ♥\n";

    document.getElementById("areaStruk").textContent = struk;

}

// CETAK STRUK

document.getElementById("btnCetak")
.addEventListener("click", function() {

    window.print();

});

// TUTUP STRUK

document.getElementById("btnTutup")
.addEventListener("click", function() {

    document.getElementById("jendelaStruk").style.display =
        "none";

});

// KELUAR

document.getElementById("btnKeluar")
.addEventListener("click", function() {

    if(confirm("Apakah Anda ingin keluar?")) {

        document.getElementById("halamanKasir").style.display =
            "none";

        document.getElementById("halamanLogin").style.display =
            "flex";

        document.getElementById("username").value = "";

        document.getElementById("password").value = "";

    }

});

// TAMPILKAN TABEL AWAL

tampilkanTabel();

</script>

</body>
</html>
